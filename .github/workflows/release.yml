name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        env:
          TAG: ${{ github.ref_name }}
        run: ./gradlew build -PmodVersion="${TAG#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          JAR="build/libs/nucleus-splits-${TAG#v}+mc26.1.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" --title "Nucleus Splits ${TAG#v}"
          else
            gh release create "$TAG" "$JAR" \
              --title "Nucleus Splits ${TAG#v}" \
              --generate-notes
          fi
